name: security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ── Trivy — filesystem CVE + misconfiguration scan ─────────────────────────
  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Trivy SARIF (all severities → Security tab)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy blocking gate (CRITICAL + HIGH unfixed)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # ── Semgrep SAST ────────────────────────────────────────────────────────────
  sast:
    name: semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: Semgrep scan
        run: |
          uv run --with semgrep semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            src/ || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

  # ── pip-audit dependency CVE check ─────────────────────────────────────────
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: pip-audit (blocking on known CVEs)
        run: uv run --with pip-audit pip-audit

  # ── Gitleaks secrets scan ───────────────────────────────────────────────────
  secrets:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Gitleaks (licensed org action)
        if: ${{ secrets.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Gitleaks (free CLI fallback)
        if: ${{ secrets.GITLEAKS_LICENSE == '' }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source="/src" \
            --no-banner \
            --redact \
            --exit-code=1

      - name: Gitleaks skipped notification
        if: ${{ secrets.GITLEAKS_LICENSE == '' }}
        run: echo "Using the free Gitleaks CLI fallback because no GITLEAKS_LICENSE secret is configured."
