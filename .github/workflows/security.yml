name: security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC

permissions:
  contents: read

jobs:
  # ── Trivy — filesystem CVE + misconfiguration scan ─────────────────────────
  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        # curl retries, including failed DNS lookups: one bad lookup must not block a security release
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf trivy.tar.gz -C "$HOME/.local/bin" trivy
          rm trivy.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy SARIF (all severities → Security tab)
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy blocking gate (CRITICAL + HIGH unfixed)
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .

  # ── Semgrep SAST ────────────────────────────────────────────────────────────
  sast:
    name: semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: Semgrep scan
        run: |
          uv run --with semgrep semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            src/ || true

      - name: Drop reviewed suppressions
        # GitHub ignores SARIF suppressions; findings marked `# nosemgrep` were reviewed, and the reason is in the code
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("semgrep-results.sarif")
          if path.is_file():
              data = json.loads(path.read_text())
              for run in data.get("runs", []):
                  run["results"] = [r for r in run.get("results", []) if not r.get("suppressions")]
              path.write_text(json.dumps(data))
          PY

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

  # ── pip-audit dependency CVE check ─────────────────────────────────────────
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: pip-audit (blocking on known CVEs)
        run: uv run --with pip-audit pip-audit

  # ── Gitleaks secrets scan ───────────────────────────────────────────────────
  secrets:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks (licensed org action)
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}

      - name: Gitleaks (free CLI fallback)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source="/src" \
            --no-banner \
            --redact \
            --exit-code=1

      - name: Gitleaks skipped notification
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        run: echo "Using the free Gitleaks CLI fallback because no GITLEAKS_LICENSE secret is configured."
