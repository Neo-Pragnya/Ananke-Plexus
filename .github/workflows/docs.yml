name: docs

# Validates the MkDocs build that ships *inside the wheel* for `ananke docs build` / `ananke docs serve`
# (offline docs). The hosted site at GitHub Pages is the Astro site in website/, deployed by docs-site.yml.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-docs:
    name: offline docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Copy assets into docs directory
        run: |
          rm -rf docs/assets
          mkdir -p docs/assets
          cp -R assets/. docs/assets/

      - name: Build MkDocs site (strict)
        run: uv run mkdocs build --strict --site-dir site
