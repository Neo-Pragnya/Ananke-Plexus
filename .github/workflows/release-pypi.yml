name: release-pypi

# Triggered by a vX.Y.Z tag push.
# Build-once, attest, scan with Trivy, then publish via uv + OIDC Trusted Publishing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uv run --with twine twine check dist/*

      - name: Generate SBOM (CycloneDX)
        run: |
          uv run --with cyclonedx-bom cyclonedx-py environment \
            --output-format json \
            --output-file dist/sbom.cdx.json
        continue-on-error: true

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # ── 2. Trivy security gate ─────────────────────────────────────────────────
  trivy:
    name: trivy security gate
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy SARIF scan (all severities)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy blocking gate (CRITICAL + HIGH, unfixed)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # ── 3. Build provenance attestation ───────────────────────────────────────
  provenance:
    name: attest provenance
    runs-on: ubuntu-latest
    needs: [build, trivy]
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  # ── 4. Publish to PyPI ─────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, trivy, provenance]
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download exact dist artifacts from build step
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Publish to PyPI (OIDC Trusted Publishing)
        run: uv publish --trusted-publishing always

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            Published to [PyPI](https://pypi.org/project/ananke-plexus/).
            See [CHANGELOG.md](https://github.com/neo-pragnya/ananke-plexus/blob/main/CHANGELOG.md) for details.
