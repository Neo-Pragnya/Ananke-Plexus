name: release-testpypi

# Publishes to TestPyPI on every version tag for pre-release validation.
# Uses the same build artifact as release-pypi (build-once pattern).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uv run --with twine twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # ── 2. Trivy security gate ─────────────────────────────────────────────────
  trivy:
    name: trivy security gate
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: Trivy SARIF scan
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy blocking gate (CRITICAL only for TestPyPI)
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            .

  # ── 3. Build provenance attestation ───────────────────────────────────────
  provenance:
    name: attest provenance
    runs-on: ubuntu-latest
    needs: [build, trivy]
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: "dist/*"

  # ── 4. Publish to TestPyPI ─────────────────────────────────────────────────
  publish:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, trivy, provenance]
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download exact dist artifacts from build step
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: Publish to TestPyPI (OIDC Trusted Publishing)
        id: publish_oidc
        continue-on-error: true
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --trusted-publishing always

      - name: Publish to TestPyPI (token fallback)
        if: ${{ steps.publish_oidc.outcome == 'failure' }}
        env:
          UV_PUBLISH_TOKEN_TESTPYPI: ${{ secrets.UV_PUBLISH_TOKEN_TESTPYPI }}
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          TOKEN="${UV_PUBLISH_TOKEN_TESTPYPI:-$TEST_PYPI_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "Trusted publishing failed and no TestPyPI token secret is configured."
            echo "Set UV_PUBLISH_TOKEN_TESTPYPI or TEST_PYPI_API_TOKEN in the testpypi environment secrets."
            exit 1
          fi
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --token "$TOKEN"
