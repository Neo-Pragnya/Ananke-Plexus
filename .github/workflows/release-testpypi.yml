name: release-testpypi

# Publishes to TestPyPI on every version tag for pre-release validation.
# Uses the same build artifact as release-pypi (build-once pattern).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # TestPyPI is optional. Enable it once TestPyPI has a trusted publisher (or a UV_PUBLISH_TOKEN_TESTPYPI secret):
  #   gh variable set TESTPYPI_ENABLED --body true
  testpypi-disabled:
    name: TestPyPI not configured (skipped)
    runs-on: ubuntu-latest
    if: vars.TESTPYPI_ENABLED != 'true'
    steps:
      - name: Explain how to enable TestPyPI
        run: |
          {
            echo "### TestPyPI publishing is off"
            echo "Add a trusted publisher on https://test.pypi.org/manage/account/publishing/ for this repository"
            echo "(workflow \`release-testpypi.yml\`, environment \`testpypi\`), then run:"
            echo ""
            echo "    gh variable set TESTPYPI_ENABLED --body true"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 1. Build ───────────────────────────────────────────────────────────────
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: false # release job: never restore a cache a PR could have poisoned
          version: "latest"

      - name: Verify package version matches release tag
        run: |
          VERSION="$(uv run python -c 'from ananke.plexus.version import __version__; print(__version__)')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "Package version: $VERSION"
          echo "Release tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: package version ($VERSION) does not match tag ($TAG)."
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uv run --with twine twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # ── 2. Trivy security gate ─────────────────────────────────────────────────
  trivy:
    name: trivy security gate
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Trivy SARIF scan
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy blocking gate (CRITICAL only for TestPyPI)
        run: |
          trivy fs \
            --cache-dir .trivy-cache \
            --ignorefile .trivyignore \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            .

  # ── 3. Build provenance attestation ───────────────────────────────────────
  provenance:
    name: attest provenance
    runs-on: ubuntu-latest
    needs: [build, trivy]
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: "dist/*"

  # ── 4. Publish to TestPyPI ─────────────────────────────────────────────────
  publish:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, trivy, provenance]
    if: vars.TESTPYPI_ENABLED == 'true'
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download exact dist artifacts from build step
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: testpypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: false # release job: never restore a cache a PR could have poisoned
          version: "latest"

      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN_TESTPYPI }}
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --trusted-publishing automatic
