[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ananke-plexus"
dynamic = ["version"]
description = "A local-first ADLC control plane for governed agentic software engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Neo Pragnya Architecture Group" }]
keywords = [
  "agentic",
  "adlc",
  "spec-driven-development",
  "architecture-as-code",
  "mcp",
  "code-graph",
  "ai-agents",
  "software-supply-chain",
  "devsecops",
  "policy-engine",
  "calm",
  "evidence",
  "tensegrity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "httpx>=0.28,<1",
  "platformdirs>=4,<5",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
telemetry = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
]
jira = ["atlassian-python-api>=3"]
security = [
  "pip-audit>=2.8",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "mypy>=1.15",
  "ruff>=0.12",
  "pre-commit>=4",
  "python-dotenv>=1.0",
  # uv handles build+publish; no twine dependency needed
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "pymdown-extensions>=10.15",
]
eval-otel = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
]
eval-mlflow = [
  "mlflow>=2.12",
]
eval-pydantic = [
  "pydantic-evals>=0.1",
]
eval-deepeval = [
  "deepeval>=1.0",
]
eval-inspect = [
  "inspect-ai>=0.3",
]
eval-ragas = [
  "ragas>=0.1",
]
eval-openevals = [
  "openevals>=0.1",
]
eval-agentevals = [
  "agentevals>=0.0.9,<0.1",
]
eval-enterprise = [
  "ananke-plexus[eval-otel,eval-mlflow]",
  "jsonschema>=4.23",
]
test-python = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-xdist>=3",
  "pytest-json-report>=1.5",
]
test-bdd = [
  "pytest-bdd>=7",
]
test-property = [
  "hypothesis>=6.100",
]
test-api = [
  "schemathesis>=3.28",
]
test-snapshot = [
  "syrupy>=4",
]
test-mutation = [
  "mutmut>=2.5",
]
test-contract = [
  "pact-python>=2",
]
test-automation = [
  "nox>=2024.4",
]
test-all = [
  "ananke-plexus[test-python,test-bdd,test-property,test-api,test-snapshot]",
]
registry-fast = [
  "blake3>=1.0",
]
registry-zstd = [
  "zstandard>=0.22",
]
registry-signing = [
  "cryptography>=42",
]
registry-watch = [
  "watchfiles>=0.21",
]
registry-analytics = [
  "duckdb>=1.0",
]
registry-validate = [
  "jsonschema>=4.23",
]
registry = [
  "ananke-plexus[registry-fast,registry-zstd,registry-validate,registry-signing,registry-watch]",
]
all = [
  "ananke-plexus[mcp,telemetry,jira,security,docs,eval-enterprise,test-python,registry]",
]

[project.urls]
Homepage = "https://github.com/Neo-Pragnya/Ananke-Plexus"
Documentation = "https://neo-pragnya.github.io/Ananke-Plexus/"
Changelog = "https://github.com/Neo-Pragnya/Ananke-Plexus/releases"
Issues = "https://github.com/Neo-Pragnya/Ananke-Plexus/issues"

[project.scripts]
ananke = "ananke.plexus.cli.app:app"
apm = "ananke.plexus.apm.cli:app"

[tool.hatch.version]
path = "src/ananke/plexus/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/src/ananke",
  "/assets/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ananke"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "mypy>=1.15",
  "ruff>=0.12",
  "pre-commit>=4",
  "python-dotenv>=1.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "pymdown-extensions>=10.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
# B008: function calls in default arg — Typer requires it
# E501: line too long — accepted in CLI wrappers, complex expressions, tests
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# S101: use of assert — expected in tests
# S603/S607: subprocess in tests uses controlled static commands
# S604: shell=True in test stubs for sandbox checks
# S314: XML parsing in tests is our own generated output, not untrusted input
# S105: false positive — "PASS" is a status-code string, not a password
# B017: tests intentionally catch broad Exception at boundaries
# S311: seeded random.Random drives property-style tests, never crypto
# S608: test-only SQL built from literal column names
"tests/**/*.py" = ["S101", "S603", "S604", "S607", "S314", "S105", "S106", "B017", "S311", "S608"]
# S604: BackendCapabilities(shell=True) is a Pydantic field, not subprocess
# S607: all subprocess calls use static commands; shutil.which used for full path
"src/ananke/plexus/backends/adapters/*.py" = ["S604", "S607"]
# S607: git/subprocess calls use static 'git' binary — intentional
"src/ananke/plexus/lifecycle/git.py" = ["S607"]
"src/ananke/plexus/lifecycle/worktree.py" = ["S607"]
# S607: secrets resolver invokes user-configured commands
"src/ananke/plexus/config/secrets.py" = ["S607"]
# S607: MCP git commit uses static git binary
"src/ananke/plexus/mcp/tools.py" = ["S607"]
# S202: tarfile.extractall — Python 3.11; filter= added in 3.12
"src/ananke/plexus/apm/bundle.py" = ["S202"]
# S603/S607: testing adapters use static controlled commands — intentional
"src/ananke/plexus/testing/adapters/*.py" = ["S603", "S607"]
# S105: false positive — "pass" is a QualityGateVerdict value, not a password
"src/ananke/plexus/testing/policy/gates.py" = ["S105"]
"src/ananke/plexus/testing/models/test.py" = ["S105"]
"src/ananke/plexus/evals/models/score.py" = ["S105"]
"src/ananke/plexus/evals/models/report.py" = ["S105"]
"src/ananke/plexus/evals/models/dataset.py" = ["S105"]
# S110/S112: intentional silent pass — discovery scans untrusted file trees
"src/ananke/plexus/testing/discovery.py" = ["S112"]
"src/ananke/plexus/testing/adapters/kani.py" = ["S112"]
"src/ananke/plexus/testing/api.py" = ["S110"]
"src/ananke/plexus/evals/datasets/loader.py" = ["S110"]
# S311: sampling for statistical confidence intervals, not crypto
"src/ananke/plexus/evals/regression/statistics.py" = ["S311"]
# S704: Markup wraps output of the safe Markdown renderer / SVG generator (both escape their input)
"src/ananke/plexus/registry/docsgen/render.py" = ["S704"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "ragas",
  "openevals",
  "inspect_ai",
  "agentevals",
  "mlflow",
  "deepeval",
  "schemathesis",
  "hypothesis",
  "pytest_jsonreport",
  "xdist",
  "yaml",
  "opentelemetry",
  "opentelemetry.*",
  # optional registry accelerators (the registry works without any of them)
  "jsonschema",
  "jsonschema.*",
  "blake3",
  "zstandard",
  "duckdb",
  "cryptography",
  "cryptography.*",
  "watchfiles",
  "compression",
  "compression.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "ananke.plexus.evals.adapters.*",
  "ananke.plexus.testing.adapters.hypothesis",
  "ananke.plexus.testing.adapters.schemathesis",
  "ananke.plexus.testing.adapters.pytest",
]
ignore_errors = false
disable_error_code = ["import-not-found", "no-any-return"]

[[tool.mypy.overrides]]
# Pre-existing type issues in non-eval code — suppressed to keep CI green
# while the new eval/testing modules are added. These files had errors before
# the eval harness work began and should be fixed in a separate pass.
module = [
  "ananke.plexus.backends.registry",
  "ananke.plexus.graph.providers.*",
  "ananke.plexus.execution.checkpoint",
  "ananke.plexus.mcp.tools",
  "ananke.plexus.hooks.models",
  "ananke.plexus.lifecycle.pr_evidence",
  "ananke.plexus.contracts.*",
  "ananke.plexus.cli.app",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ananke.plexus"]

[tool.coverage.report]
fail_under = 73
show_missing = true
omit = [
  "*/cli/app.py",
  "*/mcp/http.py",
  "*/lifecycle/http_client.py",
]
