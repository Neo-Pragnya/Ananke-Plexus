 y="92" width="696" height="451" rx="12" fill="#0b1838" stroke="#2a3d6e"/><rect x="24" y="92" width="696" height="30" rx="12" fill="#13224a"/><rect x="24" y="110" width="696" height="12" fill="#13224a"/><circle cx="42" cy="107" r="5" fill="#ff6159"/><circle cx="58" cy="107" r="5" fill="#ffbd2e"/><circle cx="74" cy="107" r="5" fill="#28c941"/><text x="372" y="111" text-anchor="middle" fill="#93a3c8" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">zsh — ~/shop</text><g clip-path="url(#tv)"><g class="scroll" style="transform:translateY(-0.0px);white-space:pre" xml:space="preserve" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13.5"><g class="p0"><text x="42" y="138.0" fill="#f0cf7a" font-weight="700">$</text><text x="58.2" y="138.0" fill="#e8eeff">ananke hooks install</text><g class="c0" transform="translate(182.2 0)"><rect x="57.2" y="124.5" width="190.2" height="21.9" fill="#0b1838"/><rect class="k0" x="57.2" y="125.5" width="7.3" height="16.5" fill="#f0cf7a" opacity="0"/></g></g><text class="o1" x="42" y="159.9" fill="#5fd3a8">✓ hooks install: 3/3 installed</text><text class="o2" x="42" y="181.7" fill="#93a3c8">  pre-commit · post-commit · pre-push</text><g class="p4"><text x="42" y="225.5" fill="#f0cf7a" font-weight="700">$</text><text x="58.2" y="225.5" fill="#e8eeff">ananke hooks run pre-commit</text><g class="c4" transform="translate(238.9 0)"><rect x="57.2" y="212.0" width="246.9" height="21.9" fill="#0b1838"/><rect class="k4" x="57.2" y="213.0" width="7.3" height="16.5" fill="#f0cf7a" opacity="0"/></g></g><text class="o5" x="42" y="247.4" fill="#ffb36b">✓ pre-commit: 4 checks, 3 blocked</text><text class="o6" x="42" y="269.2" fill="#ffb36b">  ok False</text><text class="o7" x="42" y="291.1" fill="#93a3c8"># the commit stops here until the blocked checks pass</text><g class="p9"><text x="42" y="334.8" fill="#f0cf7a" font-weight="700">$</text><text x="58.2" y="334.8" fill="#e8eeff">ananke policy explain --stage verify</text><g class="c9" transform="translate(311.8 0)"><rect x="57.2" y="321.3" width="319.8" height="21.9" fill="#0b1838"/><rect class="k9" x="57.2" y="322.3" width="7.3" height="16.5" fill="#f0cf7a" opacity="0"/></g></g><text class="o10" x="42" y="356.7" fill="#5fd3a8">✓ Policy explanation loaded.</text><text class="o11" x="42" y="378.6" fill="#93a3c8">  rule policy.core.fail-closed   severity high</text><text class="o12" x="42" y="400.4" fill="#f0cf7a">  expression config.ananke.fail_closed == true</text><text class="o13" x="42" y="422.3" fill="#5fd3a8">  expected True · actual True · PASS</text></g></g><g class="s0"><rect x="742" y="92.0" width="434" height="143.7" rx="10" fill="#0f2563" stroke="#2a3d6e"/><rect class="n0" x="742" y="92.0" width="4" height="143.7" rx="2" fill="#f0cf7a"/><circle cx="768" cy="116.0" r="12" fill="none" stroke="#f0cf7a" stroke-width="1.6"/><text x="768" y="120.5" text-anchor="middle" fill="#f0cf7a" font-size="12" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">1</text><text x="790" y="121.0" fill="#ffffff" font-size="14" font-weight="700" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">Install the hooks</text><text x="790" y="139.0" fill="#93a3c8" font-size="11.5" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">pre-commit, post-commit and pre-push run Ananke&#x27;s checks.</text><g class="t0"><circle cx="1156" cy="114.0" r="9" fill="#5fd3a8"/><path d="M1151.5 114.0 l3.2 3.4 l6 -6.6" fill="none" stroke="#0b1838" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><style>.t0{transform-box:fill-box;transform-origin:center}</style><g class="s1"><rect x="742" y="245.7" width="434" height="143.7" rx="10" fill="#0f2563" stroke="#2a3d6e"/><rect class="n1" x="742" y="245.7" width="4" height="143.7" rx="2" fill="#f0cf7a"/><circle cx="768" cy="269.7" r="12" fill="none" st