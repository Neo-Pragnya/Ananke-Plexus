# What Ananke Plexus must be able to do before a release, and how much of the CLI the scenarios exercise.
# Scenarios prove capabilities by tagging themselves @cap_<id> (dots and dashes become underscores).
# blocker: true means a failing or unproven capability BLOCKs the release; the rest hold it at CONDITIONAL.
product: Ananke Plexus
default_fixture: shop
binaries: [ananke, apm]
surface_target: 0.85

capabilities:
  - { id: packaging, title: "Installs cleanly: entry points, version, extras, bundled docs", dimension: release, blocker: true }
  - { id: bootstrap, title: "init / doctor / config: a project becomes Ananke-ready", dimension: core, blocker: true }
  - { id: spec, title: "Spec pipeline: create, plan, tasks, lock, validate, drift, converge", dimension: core, blocker: true }
  - { id: bmad, title: "BMAD contracts: compile, show, trace, verify", dimension: core, blocker: false }
  - { id: graph, title: "Code graph: build, query, impact, export", dimension: core, blocker: true }
  - { id: arch, title: "CALM architecture: init, validate, diff, reconcile, render", dimension: core, blocker: false }
  - { id: policy, title: "Policy engine: list, explain, check, packs", dimension: governance, blocker: true }
  - { id: hooks, title: "Git hooks: install, status, run, uninstall", dimension: governance, blocker: true }
  - { id: verify, title: "verify: gates run and an evidence bundle is written", dimension: governance, blocker: true }
  - { id: evidence, title: "Evidence housekeeping (prune is a dry run by default)", dimension: governance, blocker: false }
  - { id: registry, title: "Registry: learn, list, search, show, resolve, lock, verify", dimension: registry, blocker: true }
  - { id: registry-lifecycle, title: "Registry lifecycle: promote, quarantine, yank, deprecate", dimension: registry, blocker: false }
  - { id: registry-security, title: "Registry security: secrets denied, code never executed, legit twins pass", dimension: safety, blocker: true }
  - { id: dex, title: "Dex Trove integration: learn python:dex-trove and resolve its skills", dimension: ecosystem, blocker: true }
  - { id: apm, title: "apm: install, list, verify, audit", dimension: ecosystem, blocker: false }
  - { id: workflows, title: "Workflows: packs, create, show, run (dry and real), delete", dimension: automation, blocker: false }
  - { id: runs, title: "Run state machine: start, status, approvals, cancel", dimension: automation, blocker: false }
  - { id: backends, title: "Agent backends and plugins are discoverable", dimension: automation, blocker: false }
  - { id: mcp, title: "MCP server answers initialize and lists its tools over stdio", dimension: ecosystem, blocker: true }
  - { id: docs, title: "Offline docs: source resolution and build", dimension: docs, blocker: false }
  - { id: testing, title: "Testing harness: discover, run, quality gate", dimension: quality, blocker: false }
  - { id: registry-ops, title: "Registry operations: export/import, backup/restore, reports, docs, diff, gc", dimension: registry, blocker: false }
  - { id: signing, title: "Supply chain: signing keys, signatures that verify", dimension: safety, blocker: false }
  - { id: lifecycle, title: "Lifecycle helpers: branches, worktrees, evidence events, adapter auth", dimension: automation, blocker: false }
  - { id: eval, title: "Eval harness: runs report a gate decision; nothing scored is never a pass", dimension: quality, blocker: false }
  - { id: cli-ux, title: "Errors are clean: no tracebacks, no success marks on failure", dimension: usability, blocker: false }

