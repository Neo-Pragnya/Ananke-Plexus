site_name: Ananke Plexus
site_description: >-
  A local-first ADLC control plane for governed autonomous software engineering.
  Spec-driven development, CALM architecture, code graphs, policy gates, and verifiable evidence.
site_url: https://neo-pragnya.github.io/Ananke-Plexus/
repo_url: https://github.com/Neo-Pragnya/Ananke-Plexus
repo_name: Neo-Pragnya/Ananke-Plexus
copyright: Copyright &copy; 2026 Neo Pragnya Architecture Group — Apache-2.0

theme:
  name: material
  logo: assets/branding/ananke-logo.jpg
  favicon: assets/branding/ananke-logo.jpg
  palette:
    - scheme: default
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

# No third-party script ships with these docs. Material fetches Mermaid from a CDN for any fence with the `mermaid`
# class, so there's no such fence here: offline, a diagram shows as its Mermaid source, which reads well enough. The
# website draws them. A vendored Mermaid made package firewalls flag the wheel (minified code, undeclared licences).

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neo-pragnya/ananke-plexus

nav:
  - Home: index.md
  - Concepts:
      - Why Ananke Plexus: concepts/why-ananke.md
      - System Architecture: concepts/architecture.md
      - Ananke BMAD Contracts: concepts/bmad.md
      - Code Graph Intelligence: concepts/graph.md
      - Policy Engine & Security: concepts/policy-security.md
      - MCP Server & APM: concepts/mcp-apm.md
      - Enterprise Evaluation Harness: concepts/evaluation.md
      - Skill & Agent Registry: concepts/registry.md
      - Testing & Quality Harness: concepts/testing.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - See It in Action: guides/walkthroughs.md
      - Setup & Capabilities: guides/setup-and-capabilities.md
      - Registry Guide: guides/registry-guide.md
      - Dex Trove Skill Library: guides/dex-trove.md
      - Capability Sources: guides/capability-sources.md
      - Learning Candidates: guides/learning-candidates.md
      - Workflow Assembly: guides/workflow-assembly.md
      - Code Graph: guides/code-graph.md
      - Saving Tokens: guides/saving-tokens.md
      - Business Processes: guides/business-processes.md
      - Workflows: guides/workflows.md
      - Release Guide: guides/release.md
      - Implementation Log: guides/implementation-log.md
  - Reference:
      - CLI Commands: reference/commands.md
      - App Facade: reference/app-facade.md
      - Repo Intelligence: reference/repo-intelligence.md
      - Configuration: reference/configuration.md
      - Policy Language: reference/policy.md
      - Eval Harness API: reference/eval-harness.md
      - Registry Reference: reference/registry.md
      - Test Harness Reference: reference/test-harness.md
